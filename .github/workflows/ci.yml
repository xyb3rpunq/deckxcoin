name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: chain tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Native TypeScript type stripping — no build step in this repo.
          node-version: '22.18'
          cache: npm
          cache-dependency-path: chain/package-lock.json

      - name: Install
        working-directory: chain
        run: npm ci

      - name: Test
        working-directory: chain
        run: npm test

      - name: Genesis must be reproducible
        working-directory: chain
        run: node src/cli.ts verify

      - name: Genesis hash must match the published constant
        working-directory: chain
        run: |
          EXPECTED=000081f3be3827f4e30701ab4ed75563fb610c1735154f4b41b83b8f5c444f00
          ACTUAL=$(node -e "
            import('./src/chain.ts').then(async (c) => {
              const b = await import('./src/block.ts');
              process.stdout.write(b.blockHash(c.Blockchain.create().tip.header));
            });
          ")
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          test "$EXPECTED" = "$ACTUAL"
